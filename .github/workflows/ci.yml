name: CI

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the code. Nothing here can push, comment or touch secrets.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, not a tag, so a moved tag can't change what runs here.
      # Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # npm ci installs exactly what package-lock.json lists and fails if the two disagree.
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

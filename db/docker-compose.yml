name: aici

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aici_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aici
      POSTGRES_PASSWORD: aici
      POSTGRES_DB: aici
    ports:
      - "5432:5432"
    volumes:
      - aici_db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  aici_db_data:
